name: Safe Vue preview verification
on:
  push:
    branches: [preview/lucifer-x-protected-ui-20261014]
  pull_request:
    paths:
      - 'frontend/admin-dashboard/**'
permissions:
  contents: read
jobs:
  demo-build:
    if: github.event_name == 'push' || startsWith(github.head_ref, 'preview/lucifer-x-protected-ui')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/admin-dashboard/package-lock.json
      - name: Build isolated Vue analyst preview
        working-directory: frontend/admin-dashboard
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Assert preview bundle has no backend addresses or stored login details
        working-directory: frontend/admin-dashboard
        run: |
          set -e
          if grep -ER 'localhost:8000|admin123|api/v1/threats|ML_INTERNAL_TOKEN' dist; then
            echo 'Unexpected sensitive or backend API reference in the preview bundle'
            exit 1
          fi
          grep -R -l 'ISOLATED DEMONSTRATION' dist/assets
