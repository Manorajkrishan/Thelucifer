name: Lucifer Milestone 1 Checks

on:
  pull_request:
  push:
    branches:
      - 'security/**'

permissions:
  contents: read

jobs:
  python-security-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        run: python -m pip install --disable-pip-version-check 'pytest>=7,<10' 'Flask>=3,<4' 'numpy>=1.26,<3' 'scikit-learn>=1.3,<2' 'joblib>=1.2,<2'
      - name: Fail-closed ML detection and internal authorization
        working-directory: backend/ml-service
        run: python -m pytest -q tests/test_security.py tests/test_threat_detector_security.py

  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Laravel PHP syntax
        run: find backend/api/app backend/api/routes backend/api/tests backend/api/database -name '*.php' -print0 | xargs -0 -n1 php -l
