name: Lucifer Milestone 2 Staging Gate
on:
  push:
    branches: [staging/milestone-2-private-stack-20261014]
  pull_request:
    paths:
      - 'backend/api/**'
      - 'backend/ml-service/**'
      - 'infrastructure/compose.staging.yaml'
      - 'infrastructure/oracle/**'
      - '.github/workflows/milestone2-staging.yml'
permissions:
  contents: read
jobs:
  php-postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: lucifer_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d lucifer_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: lucifer_test
      DB_USERNAME: postgres
      DB_SSLMODE: prefer
      CACHE_DRIVER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
      ALLOW_PUBLIC_REGISTRATION: 'false'
      CORS_ALLOWED_ORIGINS: ''
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql, pgsql, mbstring, gd, bcmath, xml, fileinfo
          coverage: none
      - name: Install Laravel dependencies
        working-directory: backend/api
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Generate temporary app key and run full feature tests with PostgreSQL
        working-directory: backend/api
        run: |
          set -euo pipefail
          mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views
          php artisan key:generate --show > /tmp/lucifer-app-key
          export APP_KEY
          APP_KEY=$(cat /tmp/lucifer-app-key)
          php artisan migrate --force
          php artisan test --testsuite=Feature

  ml-auth-and-configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run ML auth, document confinement and model-unavailable regression tests
        working-directory: backend/ml-service
        run: |
          python -m pip install --disable-pip-version-check Flask==3.0.0 numpy==1.26.2 scikit-learn==1.3.2 joblib==1.3.2 pytest
          python -m pytest -q tests/test_security.py tests/test_threat_detector_security.py
      - name: Validate staging Compose and Render Blueprint properties
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          import yaml
          with open('infrastructure/compose.staging.yaml', encoding='utf-8') as f:
              compose = yaml.safe_load(f)
          assert all('ports' not in service for service in compose['services'].values())
          assert compose['networks']['internal']['internal'] is True
          assert compose['services']['api']['environment']['ALLOW_PUBLIC_REGISTRATION'] == 'false'
          with open('infrastructure/oracle/compose.yaml', encoding='utf-8') as f:
              oci = yaml.safe_load(f)
          assert set(oci['services']) == {'postgres', 'api', 'ml-service', 'web'}
          assert all('ports' not in s for k, s in oci['services'].items() if k != 'web')
          assert oci['services']['web']['ports'] == ['127.0.0.1:8080:80']
          assert oci['networks']['backplane']['internal'] is True
          assert oci['services']['api']['environment']['ALLOW_PUBLIC_REGISTRATION'] == 'false'
          assert oci['services']['ml-service']['environment']['THREAT_MODEL_PATH'] == ''
          print('PASS: private Oracle-only VM profile and local staging profile')
          print('PASS: private-only Oracle staging topology')
          PY
      - name: Validate real Docker Compose topology without publishing ports
        env:
          POSTGRES_USER: lucifer_ci
        run: |
          set -euo pipefail
          export POSTGRES_PASSWORD ML_INTERNAL_TOKEN APP_KEY
          POSTGRES_PASSWORD=$(openssl rand -hex 24)
          ML_INTERNAL_TOKEN=$(openssl rand -hex 32)
          APP_KEY="base64:$(openssl rand -base64 32)"
          docker compose -f infrastructure/compose.staging.yaml config --format json > /tmp/lucifer-staging-compose.json
          python - <<'PY'
          import json
          with open('/tmp/lucifer-staging-compose.json', encoding='utf-8') as f:
              cfg = json.load(f)
          assert set(cfg['services']) == {'postgres', 'api', 'ml-service'}
          assert all(not svc.get('ports') for svc in cfg['services'].values())
          assert cfg['networks']['internal']['internal'] is True
          assert cfg['services']['api']['environment']['ML_SERVICE_URL'] == 'http://ml-service:5000'
          assert cfg['services']['api']['environment']['ALLOW_PUBLIC_REGISTRATION'] == 'false'
          print('PASS: Docker Compose resolves three service private topology, zero published ports')
          PY
